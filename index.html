<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>나의 일기</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=512&h=512&q=80">
    <link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=512&h=512&q=80">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; }
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --primary: #007AFF;
            --text-main: #1C1C1E;
            --text-sub: #8E8E93;
            --line: #E5E5EA;
            --chip-bg: #F2F2F7;
        }
        html, body {
            width: 100%; height: 100%; height: 100dvh;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text-main); display: flex; flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        /* 풀투리프레시 인디케이터 */
        .pull-bar {
            position: absolute; top: 0; left: 0; right: 0;
            height: calc(44px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background: var(--card); border-bottom: 1px solid var(--line);
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 12px; font-weight: 600; color: var(--text-sub);
            transform: translateY(-100%); transition: transform 0.2s ease; z-index: 100;
        }
        .pull-bar.refreshing { transform: translateY(0); }

        /* 캘린더 영역 */
        .cal-section {
            background: var(--card); padding: calc(16px + env(safe-area-inset-top)) 16px 12px;
            border-bottom: 1px solid var(--line); z-index: 10; flex-shrink: 0;
        }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cal-title-box { display: flex; align-items: center; gap: 8px; }
        .cal-title { font-size: 20px; font-weight: 700; }
        .today-btn {
            background: rgba(0,122,255,0.1); border: none; border-radius: 12px;
            padding: 4px 8px; font-size: 12px; font-weight: 700; color: var(--primary); cursor: pointer;
        }
        .cal-nav { display: flex; gap: 6px; }
        .cal-nav button {
            background: var(--chip-bg); border: none; border-radius: 10px;
            width: 32px; height: 32px; font-size: 16px; font-weight: 700; cursor: pointer;
        }

        .cal-board { background: #F6F7F9; border: 1px solid #E8EAED; border-radius: 16px; padding: 10px 6px 6px; }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 44px; gap: 2px; }
        .cal-cell {
            border-radius: 8px; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 2px; cursor: pointer;
        }
        .cal-cell.today .date-num { color: var(--primary); font-weight: 800; }
        .cal-cell.selected { background: #FFFFFF; box-shadow: 0 0 0 2px var(--primary); }
        .date-num { font-size: 12px; line-height: 14px; margin-bottom: 2px; }
        .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); margin-top: 4px; }
        .cal-thumb { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }

        /* 타임라인 영역 */
        .timeline {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 16px; padding-bottom: calc(50px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 12px;
        }
        .timeline-header { display: flex; justify-content: space-between; align-items: center; }
        .timeline-title { font-size: 17px; font-weight: 700; }
        .timeline-btns { display: flex; gap: 6px; align-items: center; }
        .icon-btn {
            background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            width: 32px; height: 32px; font-size: 15px; cursor: pointer;
        }
        .add-btn {
            background: var(--primary); color: #FFF; border: none; border-radius: 16px;
            padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        /* 일기 카드 */
        .card {
            background: var(--card); border-radius: 16px; padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px;
        }
        .card-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .card-meta { display: flex; gap: 6px; align-items: center; color: var(--text-sub); }
        .card-actions button { background: none; border: none; font-size: 12px; cursor: pointer; padding: 2px; }
        .card-content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

        /* 사진 그리드 */
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .photo-box {
            position: relative; width: 100%; padding-top: 100%; border-radius: 8px;
            overflow: hidden; background: #E5E5EA; cursor: pointer;
        }
        .photo-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        /* 모달 공통 */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none;
            align-items: flex-end; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-sheet {
            background: var(--card); width: 100%; max-height: 88vh; border-radius: 20px 20px 0 0;
            padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
            overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
        }
        .chip-row { display: flex; gap: 6px; overflow-x: auto; }
        .chip {
            background: var(--chip-bg); border: 1px solid transparent; border-radius: 14px;
            padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .chip.active { border-color: var(--primary); background: rgba(0,122,255,0.08); font-weight: 600; }
        .loc-row { display: flex; gap: 6px; }
        .loc-row input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; }
        .loc-row button { background: var(--chip-bg); border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; }
        .textarea-box textarea {
            width: 100%; height: 100px; border: 1px solid var(--line); border-radius: 10px;
            padding: 10px; font-size: 14px; resize: none; outline: none; font-family: inherit;
        }
        .media-previews { display: flex; gap: 8px; overflow-x: auto; min-height: 50px; }
        .preview-box { position: relative; width: 50px; height: 50px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .preview-del {
            position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: #FFF;
            border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer;
        }
        .submit-btn {
            background: var(--primary); color: #FFF; border: none; border-radius: 12px;
            padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
        }

        /* 라이트박스 */
        .lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95%; max-height: 85%; border-radius: 8px; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 풀투리프레시 -->
    <div class="pull-bar" id="pullBar">
        <span id="pullText">데이터 동기화 중...</span>
    </div>

    <!-- 캘린더 네비게이션 -->
    <div class="cal-section">
        <div class="cal-header">
            <div class="cal-title-box">
                <div class="cal-title" id="calTitle">2026년 9월</div>
                <button class="today-btn" onclick="goToday()">오늘</button>
            </div>
            <div class="cal-nav">
                <button onclick="changeMonth(-1)">‹</button>
                <button onclick="changeMonth(1)">›</button>
            </div>
        </div>
        <div class="cal-board">
            <div class="cal-weekdays">
                <span style="color:#FF3B30;">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>
    </div>

    <!-- 타임라인 -->
    <div class="timeline" id="timelineList">
        <div class="timeline-header">
            <div class="timeline-title" id="timelineTitle">2026년 9월 17일 (목)</div>
            <div class="timeline-btns">
                <button class="icon-btn" onclick="openBackup()" title="백업 및 설정">⚙️</button>
                <button class="add-btn" onclick="openModal()">➕ 기록 쓰기</button>
            </div>
        </div>
        <div id="cardContainer"></div>
    </div>

    <!-- 작성/수정 모달 -->
    <div class="modal" id="entryModal">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong id="modalTitle">새 기록 쓰기</strong>
                <button onclick="closeModal()" style="background:none; border:none; color:var(--text-sub); font-size:14px;">취소</button>
            </div>
            <div class="chip-row" id="moodRow">
                <button class="chip" data-v="😊 좋음">😊 좋음</button>
                <button class="chip" data-v="😌 평온">😌 평온</button>
                <button class="chip" data-v="🍷 여유">🍷 여유</button>
                <button class="chip" data-v="🏃 활기">🏃 활기</button>
                <button class="chip" data-v="🥱 피곤">🥱 피곤</button>
            </div>
            <div class="chip-row" id="weatherRow">
                <button class="chip" data-v="☀️ 맑음">☀️ 맑음</button>
                <button class="chip" data-v="⛅ 구름">⛅ 구름</button>
                <button class="chip" data-v="🌧️ 비">🌧️ 비</button>
                <button class="chip" data-v="❄️ 눈">❄️ 눈</button>
            </div>
            <div class="loc-row">
                <input type="text" id="locInput" placeholder="위치 (예: 서울 송파구)">
                <button onclick="fetchLocation()">현위치</button>
            </div>
            <div class="textarea-box">
                <textarea id="contentText" placeholder="오늘 어떤 일이 있었나요?"></textarea>
            </div>
            <div>
                <button class="chip" onclick="document.getElementById('fileInput').click()">📷 사진 추가 (최대 10장)</button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="handleFiles(event)">
            </div>
            <div class="media-previews" id="previewContainer"></div>
            <button class="submit-btn" id="submitBtn" onclick="saveEntry()">저장하기</button>
        </div>
    </div>

    <!-- 백업/설정 모달 -->
    <div class="modal" id="backupModal">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>데이터 백업 및 설정</strong>
                <button onclick="document.getElementById('backupModal').classList.remove('active')" style="background:none; border:none; font-size:14px;">닫기</button>
            </div>
            <button class="submit-btn" onclick="exportData()">📥 데이터 백업 다운로드 (.json)</button>
            <button class="chip" style="padding:14px; text-align:center;" onclick="document.getElementById('importInput').click()">📤 백업 파일에서 복원하기</button>
            <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)">
        </div>
    </div>

    <!-- 라이트박스 -->
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img id="lightboxImg" src="" alt="확대">
    </div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwqB0jX942QF3Epg5-r-s33DYpoGIvDJ27r2aJWILew1mYq1m0NcZ_n2EA-Ng2nnlc/exec";
    
    // 상태 관리
    let diaryEntries = [];
    let activeDate = formatDate(new Date());
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let currentEditId = null;
    let tempPhotos = [];
    let selMood = "", selWeather = "";

    function formatDate(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ==========================================
    // 1. 순수 IndexedDB 스토리지 엔진
    // ==========================================
    const DB_NAME = 'CleanDiaryDB';
    const DB_STORE = 'entries';

    function openDB() {
        return new Promise(resolve => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE, { keyPath: 'id' });
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    async function dbGetAll() {
        const db = await openDB();
        if (!db) return [];
        return new Promise(resolve => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
        });
    }

    async function dbPut(item) {
        const db = await openDB();
        if (!db) return;
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(item);
    }

    async function dbDelete(id) {
        const db = await openDB();
        if (!db) return;
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(id);
    }

    // ==========================================
    // 2. 초기화 및 렌더링
    // ==========================================
    async function init() {
        setupChips();
        diaryEntries = await dbGetAll();
        renderCalendar();
        renderTimeline();
        syncCloud();
        setupPullToRefresh();
    }

    function renderCalendar() {
        document.getElementById('calTitle').innerText = `${viewYear}년 ${viewMonth + 1}월`;
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
        const todayStr = formatDate(new Date());

        for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';

        for (let d = 1; d <= lastDate; d++) {
            const dStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const entries = diaryEntries.filter(e => e.date === dStr);
            const isToday = dStr === todayStr ? 'today' : '';
            const isSel = dStr === activeDate ? 'selected' : '';

            let badgeHtml = '';
            // 해당 날짜에 사진이 있으면 고유 썸네일 표시
            const hasThumb = entries.find(e => e.microThumb || (e.media && e.media[0]));
            if (hasThumb) {
                const src = hasThumb.microThumb || (hasThumb.media[0] && hasThumb.media[0].src);
                badgeHtml = `<img src="${src}" class="cal-thumb" alt="thumb">`;
            } else if (entries.length > 0) {
                badgeHtml = `<div class="cal-dot"></div>`;
            }

            grid.innerHTML += `
                <div class="cal-cell ${isToday} ${isSel}" onclick="selectDate('${dStr}')">
                    <span class="date-num">${d}</span>
                    ${badgeHtml}
                </div>
            `;
        }
    }

    function selectDate(dStr) {
        activeDate = dStr;
        renderCalendar();
        renderTimeline();
    }

    function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        else if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        renderCalendar();
    }

    function goToday() {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth();
        activeDate = formatDate(t);
        renderCalendar();
        renderTimeline();
    }

    function renderTimeline() {
        const parts = activeDate.split('-');
        const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        document.getElementById('timelineTitle').innerText = 
            `${dObj.getFullYear()}년 ${dObj.getMonth()+1}월 ${dObj.getDate()}일 (${dayNames[dObj.getDay()]})`;

        const box = document.getElementById('cardContainer');
        box.innerHTML = '';

        const entries = diaryEntries.filter(e => e.date === activeDate);
        if (entries.length === 0) {
            box.innerHTML = `<div style="text-align:center; color:var(--text-sub); margin-top:40px; font-size:14px;">작성된 일기가 없습니다.</div>`;
            return;
        }

        entries.forEach(item => {
            let photosHtml = '';
            if (item.media && item.media.length > 0) {
                photosHtml = `<div class="photo-grid">`;
                item.media.forEach(m => {
                    // 각 사진 고유의 src를 렌더링 (타 사진 썸네일 복제 코드 원천 차단)
                    const imgUrl = m.src || m.viewUrl || '';
                    if (imgUrl) {
                        photosHtml += `
                            <div class="photo-box" onclick="viewPhoto('${imgUrl}')">
                                <img src="${imgUrl}" loading="lazy" referrerpolicy="no-referrer" alt="사진">
                            </div>
                        `;
                    }
                });
                photosHtml += `</div>`;
            }

            const moodHtml = item.mood ? `<span>${item.mood}</span>` : '';
            const weatherHtml = item.weather ? `<span>${item.weather}</span>` : '';
            const locHtml = item.location ? `<span style="background:var(--chip-bg); padding:2px 6px; border-radius:4px;">📍 ${item.location}</span>` : '';

            box.innerHTML += `
                <div class="card">
                    <div class="card-top">
                        <div class="card-meta">
                            <strong>${item.time || ''}</strong> ${moodHtml} ${weatherHtml} ${locHtml}
                        </div>
                        <div class="card-actions">
                            <button style="color:var(--primary); font-weight:600;" onclick="openModal('${item.id}')">수정</button>
                            <button style="color:#FF3B30;" onclick="removeEntry('${item.id}')">삭제</button>
                        </div>
                    </div>
                    <div class="card-content">${item.content || ''}</div>
                    ${photosHtml}
                </div>
            `;
        });
    }

    // ==========================================
    // 3. 사진 압축 및 파일 처리
    // ==========================================
    function compressImage(file, maxDim, quality) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
                    else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function createThumb(file) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 44; canvas.height = 44;
                    const min = Math.min(img.width, img.height);
                    canvas.getContext('2d').drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, 44, 44);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function handleFiles(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        for (const f of files) {
            const highRes = await compressImage(f, 900, 0.75);
            tempPhotos.push({ type: 'image', src: highRes });
        }
        renderPreviews();
        e.target.value = '';
    }

    function renderPreviews() {
        const box = document.getElementById('previewContainer');
        box.innerHTML = '';
        tempPhotos.forEach((p, idx) => {
            box.innerHTML += `
                <div class="preview-box">
                    <img src="${p.src}">
                    <button class="preview-del" onclick="tempPhotos.splice(${idx},1); renderPreviews();">✕</button>
                </div>
            `;
        });
    }

    // ==========================================
    // 4. 일기 저장 / 삭제
    // ==========================================
    async function saveEntry() {
        const content = document.getElementById('contentText').value.trim();
        if (!content && tempPhotos.length === 0 && !selMood && !selWeather) {
            alert("일기 내용을 입력해 주세요.");
            return;
        }

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        let microThumb = "";
        if (tempPhotos.length > 0) {
            // 첫 번째 사진을 캘린더용 44px로 생성
            microThumb = tempPhotos[0].src;
        }

        let entryItem = null;
        if (currentEditId) {
            entryItem = diaryEntries.find(e => e.id === currentEditId);
            if (entryItem) {
                entryItem.content = content;
                entryItem.mood = selMood;
                entryItem.weather = selWeather;
                entryItem.location = document.getElementById('locInput').value.trim();
                entryItem.media = [...tempPhotos];
                if (microThumb) entryItem.microThumb = microThumb;
                entryItem.updatedAt = Date.now();
            }
        } else {
            entryItem = {
                id: 'entry_' + Date.now(),
                date: activeDate,
                time: timeStr,
                mood: selMood,
                weather: selWeather,
                location: document.getElementById('locInput').value.trim(),
                content: content,
                media: [...tempPhotos],
                microThumb: microThumb,
                updatedAt: Date.now()
            };
            diaryEntries.unshift(entryItem);
        }

        // IndexedDB에 영구 보존
        await dbPut(entryItem);
        renderCalendar();
        renderTimeline();
        closeModal();

        // 백엔드 전송
        if (GAS_URL) {
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: 'SAVE_ENTRY',
                    ...entryItem,
                    media: entryItem.media.map(m => ({
                        type: m.type,
                        base64: m.src && m.src.startsWith('data:') ? m.src : '',
                        viewUrl: m.viewUrl || ''
                    }))
                })
            }).catch(() => {});
        }
    }

    async function removeEntry(id) {
        if (!confirm("이 일기를 삭제할까요?")) return;
        diaryEntries = diaryEntries.filter(e => e.id !== id);
        await dbDelete(id);
        renderCalendar();
        renderTimeline();

        if (GAS_URL) {
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'DELETE_ENTRY', id })
            }).catch(() => {});
        }
    }

    // ==========================================
    // 5. 클라우드 동기화 (로컬 Base64 불변 보존)
    // ==========================================
    async function syncCloud(callback) {
        if (!GAS_URL || !navigator.onLine) { if (callback) callback(); return; }
        
        try {
            const res = await fetch(GAS_URL + '?t=' + Date.now(), { cache: 'no-store' });
            const json = await res.json();
            if (json.status === 'success' && Array.isArray(json.data)) {
                const cloudList = json.data;
                const map = new Map(diaryEntries.map(e => [e.id, e]));

                cloudList.forEach(cloud => {
                    if (!cloud || !cloud.id) return;
                    if (!map.has(cloud.id)) {
                        // 로컬에 없는 일기면 클라우드 것 추가
                        const newMedia = (cloud.media || []).map(m => ({
                            type: m.type || 'image',
                            src: m.viewUrl || '',
                            viewUrl: m.viewUrl || ''
                        }));
                        map.set(cloud.id, { ...cloud, media: newMedia });
                    } else {
                        // 로컬에 이미 있는 일기면 고화질 src는 유지하고 viewUrl만 연결
                        const local = map.get(cloud.id);
                        if (cloud.media && local.media) {
                            cloud.media.forEach((cm, i) => {
                                if (local.media[i] && cm.viewUrl) {
                                    local.media[i].viewUrl = cm.viewUrl;
                                    // 로컬 src가 비어있던 경우에만 viewUrl로 보충
                                    if (!local.media[i].src) local.media[i].src = cm.viewUrl;
                                }
                            });
                        }
                    }
                });

                diaryEntries = Array.from(map.values());
                diaryEntries.sort((a, b) => (b.date + ' ' + b.time).localeCompare(a.date + ' ' + a.time));

                // IndexedDB 갱신
                for (const item of diaryEntries) await dbPut(item);

                renderCalendar();
                renderTimeline();
            }
        } catch (e) {}
        if (callback) callback();
    }

    // ==========================================
    // 6. UI 이벤트 및 제스처
    // ==========================================
    function setupChips() {
        document.querySelectorAll('#moodRow .chip').forEach(btn => {
            btn.onclick = () => {
                selMood = (selMood === btn.dataset.v) ? "" : btn.dataset.v;
                document.querySelectorAll('#moodRow .chip').forEach(b => b.classList.toggle('active', b.dataset.v === selMood));
            };
        });
        document.querySelectorAll('#weatherRow .chip').forEach(btn => {
            btn.onclick = () => {
                selWeather = (selWeather === btn.dataset.v) ? "" : btn.dataset.v;
                document.querySelectorAll('#weatherRow .chip').forEach(b => b.classList.toggle('active', b.dataset.v === selWeather));
            };
        });
    }

    function openModal(editId = null) {
        currentEditId = editId;
        tempPhotos = [];
        if (editId) {
            const item = diaryEntries.find(e => e.id === editId);
            if (!item) return;
            document.getElementById('modalTitle').innerText = `${item.date} 기록 수정`;
            document.getElementById('contentText').value = item.content || '';
            document.getElementById('locInput').value = item.location || '';
            selMood = item.mood || '';
            selWeather = item.weather || '';
            tempPhotos = (item.media || []).map(m => ({ ...m }));
        } else {
            document.getElementById('modalTitle').innerText = `${activeDate} 새 기록`;
            document.getElementById('contentText').value = '';
            document.getElementById('locInput').value = '';
            selMood = ''; selWeather = '';
        }
        document.querySelectorAll('#moodRow .chip').forEach(b => b.classList.toggle('active', b.dataset.v === selMood));
        document.querySelectorAll('#weatherRow .chip').forEach(b => b.classList.toggle('active', b.dataset.v === selWeather));
        renderPreviews();
        document.getElementById('entryModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('entryModal').classList.remove('active');
        currentEditId = null;
    }

    function fetchLocation() {
        if (!navigator.geolocation) return;
        const inp = document.getElementById('locInput');
        inp.placeholder = "확인 중...";
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
                .then(r => r.json())
                .then(d => {
                    const a = d.address || {};
                    inp.value = `${a.city || a.province || ''} ${a.borough || a.district || ''}`.trim() || '서울';
                }).catch(() => inp.value = '대한민국');
        }, () => inp.value = '위치 확인 불가', { timeout: 6000 });
    }

    function viewPhoto(url) {
        document.getElementById('lightboxImg').src = url;
        document.getElementById('lightbox').classList.add('active');
    }

    function setupPullToRefresh() {
        const bar = document.getElementById('pullBar');
        const list = document.getElementById('timelineList');
        let startY = 0;

        document.addEventListener('touchstart', e => {
            if (list.scrollTop <= 0) startY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (list.scrollTop <= 0 && e.changedTouches[0].clientY - startY > 60) {
                bar.classList.add('refreshing');
                syncCloud(() => setTimeout(() => bar.classList.remove('refreshing'), 500));
            }
        });
    }

    function openBackup() {
        document.getElementById('backupModal').classList.add('active');
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(diaryEntries, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `diary_backup_${formatDate(new Date())}.json`;
        a.click();
    }

    function importData(e) {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = async ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (Array.isArray(data)) {
                    for (const item of data) await dbPut(item);
                    diaryEntries = await dbGetAll();
                    renderCalendar();
                    renderTimeline();
                    alert("복원 완료되었습니다.");
                    document.getElementById('backupModal').classList.remove('active');
                }
            } catch (err) { alert("올바른 백업 파일이 아닙니다."); }
        };
        r.readAsText(f);
    }

    init();
</script>
</body>
</html>
